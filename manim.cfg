[CLI]
# scripts/manim.sh overrides media_dir with <input-file-directory>/output.
# This fallback applies only when Manim is invoked directly.
media_dir = ./output
images_dir = {media_dir}/images
video_dir = {media_dir}/videos/{module_name}/{quality}
tex_dir = {media_dir}/Tex
text_dir = {media_dir}/texts
partial_movie_dir = {video_dir}/partial_movie_files/{scene_name}
frame_rate = 30
pixel_width = 1920
pixel_height = 1080
background_color = #0B1020
verbosity = WARNING
disable_caching = False
